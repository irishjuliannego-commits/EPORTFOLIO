<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <defs>
    <linearGradient id="surveyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a42" />
      <stop offset="100%" stop-color="#111d2e" />
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#surveyGrad)" rx="8" />
  
  <!-- Grid / Contour lines -->
  <path d="M0 80 Q150 50 300 90 T600 60" fill="none" stroke="rgba(201,168,76,0.1)" stroke-width="1.5" />
  <path d="M0 140 Q200 110 350 160 T600 120" fill="none" stroke="rgba(201,168,76,0.15)" stroke-width="1.5" />
  <path d="M0 220 Q180 260 380 200 T600 240" fill="none" stroke="rgba(201,168,76,0.12)" stroke-width="1.5" />
  <path d="M0 300 Q240 270 420 320 T600 290" fill="none" stroke="rgba(201,168,76,0.1)" stroke-width="1.5" />

  <!-- Total Station / Theodolite on Tripod Icon Graphic -->
  <g transform="translate(300, 175)">
    <!-- Tripod legs -->
    <line x1="0" y1="20" x2="-65" y2="120" stroke="#c9a84c" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="20" x2="0" y2="125" stroke="#a88a34" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="20" x2="65" y2="120" stroke="#c9a84c" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-35" y1="75" x2="35" y2="75" stroke="#dfc376" stroke-width="2" />
    
    <!-- Tribrach & Base -->
    <polygon points="-25,20 25,20 20,5 -20,5" fill="#243550" stroke="#c9a84c" stroke-width="2" />
    
    <!-- Instrument body -->
    <rect x="-22" y="-45" width="44" height="50" rx="4" fill="#1e3050" stroke="#c9a84c" stroke-width="2" />
    <!-- Optical telescope -->
    <rect x="-42" y="-30" width="84" height="16" rx="3" fill="#2d3e56" stroke="#dfc376" stroke-width="2" />
    <circle cx="42" cy="-22" r="11" fill="#c9a84c" opacity="0.8" />
    <!-- Display screen -->
    <rect x="-14" y="-18" width="28" height="16" rx="2" fill="#0f1b2d" stroke="#5b9bd5" stroke-width="1" />
    <!-- Laser beam / sightline -->
    <line x1="42" y1="-22" x2="220" y2="-55" stroke="rgba(91,155,213,0.5)" stroke-width="2" stroke-dasharray="6 3" />
    
    <!-- Target Prism / Coordinate Pin -->
    <circle cx="220" cy="-55" r="8" fill="#e06060" />
    <circle cx="220" cy="-55" r="14" fill="none" stroke="#e06060" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- Tag Label -->
  <rect x="200" y="325" width="200" height="28" rx="14" fill="#0f1b2d" stroke="#c9a84c" stroke-width="1" />
  <text x="300" y="343" fill="#dfc376" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">GEODETIC FIELDWORK / PHOTO</text>
</svg>
